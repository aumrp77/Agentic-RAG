<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Munger Talks - Chat with Charlie Munger's Wisdom</title>
    <meta name="description" content="Interactive chat with Charlie Munger's investment wisdom and mental models through advanced RAG AI technology." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        margin: 0;
        font-family: 'Source Sans Pro', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      .markdown-content h1,
      .markdown-content h2,
      .markdown-content h3,
      .markdown-content h4,
      .markdown-content h5,
      .markdown-content h6 {
        font-family: 'Merriweather', serif;
        margin-top: 1rem;
        margin-bottom: 0.5rem;
      }
      
      .markdown-content p {
        margin-bottom: 1rem;
        line-height: 1.6;
      }
      
      .markdown-content ul,
      .markdown-content ol {
        margin-bottom: 1rem;
        padding-left: 1.5rem;
      }
      
      .markdown-content li {
        margin-bottom: 0.25rem;
      }
      
      .markdown-content blockquote {
        border-left: 4px solid #e2e8f0;
        padding-left: 1rem;
        margin: 1rem 0;
        font-style: italic;
        color: #4a5568;
      }
      
      .markdown-content code {
        background-color: #f7fafc;
        padding: 0.125rem 0.25rem;
        border-radius: 0.25rem;
        font-size: 0.875em;
        font-family: 'Monaco', 'Consolas', monospace;
      }
      
      .markdown-content pre {
        background-color: #f7fafc;
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        margin: 1rem 0;
      }
      
      .markdown-content pre code {
        background-color: transparent;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
