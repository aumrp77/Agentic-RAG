[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "munger-rag-backend"
version = "0.1.0"
description = "Personal Multimodal AI Assistant - The Munger RAG Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "your.email@example.com" }]
keywords = ["ai", "rag", "multimodal", "assistant", "langchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.0",

    # AI/ML Core
    "openai>=1.3.0",
    "google-generativeai>=0.3.0",
    "anthropic>=0.7.0",
    "huggingface-hub>=0.19.0",
    "tokenizers>=0.15.0",

    # RAG and Vector Storage
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-google-genai>=0.0.6",
    "langchain-anthropic>=0.1.0",
    "langchain-community>=0.1.0",
    "langgraph>=0.2.0",
    "chromadb>=0.4.0",
    "pinecone-client>=2.2.0",
    "langchain-experimental>=0.1.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.10.0",
    "pypdf>=3.17.0",
    # Advanced AI Frameworks
    "crewai>=0.28.0",
    "crewai-tools>=0.1.0",
    "dspy-ai>=2.4.0",

    # Additional AI/ML tools
    "autogen-agentchat>=0.2.0",
    "llama-index>=0.9.0",

    # Data Processing
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "pillow>=10.0.0",
    "pypdf>=3.17.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",

    # Configuration & Environment
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Development utilities
    "rich>=13.0.0",
    "typer>=0.9.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",          # for testing FastAPI

    # Code quality
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pylint>=2.17.0",

    # Documentation
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.23.0",
]

streamlit = ["streamlit>=1.28.0", "streamlit-chat>=0.1.1", "plotly>=5.17.0"]

jupyter = [
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    "ipywidgets>=8.1.0",
    "notebook>=7.0.0",
]

experiments = [
    # Research and experimentation
    "wandb>=0.16.0",
    "mlflow>=2.8.0",
    "optuna>=3.4.0",
    "ray[tune]>=2.8.0",

    # Advanced multimodal
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "accelerate>=0.24.0",
]

all = ["munger-rag-backend[dev,streamlit,jupyter,experiments]"]

[project.urls]
Homepage = "https://github.com/yourusername/the-munger-talks"
Repository = "https://github.com/yourusername/the-munger-talks"
Issues = "https://github.com/yourusername/the-munger-talks/issues"

[project.scripts]
munger-agent = "backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.envs.default]
dependencies = ["munger-rag-agent[dev]"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["backend"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "pinecone.*", "streamlit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
